services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: v03-dev
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - V03_DEBUG=true
      - V03_CORS_ORIGINS=["http://localhost:3000"]
      - PYTHONPATH=/workspace/v03_종목추천/backend:/workspace
    stdin_open: true
    tty: true
    command: bash
    restart: unless-stopped
