# Pipeline Settings — Manual Curation + Auto Pipeline

# ── Paths ────────────────────────────────────────
paths:
  pine_dir: "indicators/pine"              # User places .pine files here
  converted_dir: "indicators/converted"    # Auto-generated Python modules
  price_cache_dir: "data/price_cache"
  reports_dir: "reports"

# ── Converter (Stage 2) ─────────────────────────
converter:
  llm_model: "claude-sonnet-4-20250514"
  max_retries: 3
  timeout: 60

# ── Verifier (Stage 3) ──────────────────────────
verifier:
  default_recent_bars: 100
  signal_frequency_warn_threshold: 0.001   # Warn if signals < 0.1% of bars

# ── Analyzer (Stage 4) ──────────────────────────
analyzer:
  llm_model: "claude-sonnet-4-20250514"

# ── Combiner (Stage 5) ──────────────────────────
combiner:
  max_strategies: 1000
  strategy_size: [2, 4]          # Min/max indicators per strategy
  parameter_variants: 3          # Default + ±1 variant per param

# ── Backtester (Stage 6) ────────────────────────
backtest:
  defaults:
    asset: "BTC/USDT"
    timeframe: "1d"
    initial_capital: 10000
    leverage: 1
    commission_pct: 0.05         # Per trade (round trip = 0.1%)
    slippage_pct: 0.1

  # Predefined test periods
  periods:
    bull_market: ["2020-04-01", "2021-11-01"]
    bear_market: ["2022-01-01", "2022-12-31"]
    sideways: ["2023-06-01", "2024-02-01"]
    full_cycle: ["2020-01-01", "2025-01-01"]

  # Composite score weights
  scoring_weights:
    sharpe: 0.3
    excess_return: 0.2
    win_rate: 0.2
    consistency: 0.15
    mdd_inverse: 0.15

  # Quick scan cutoff
  quick_scan_top_pct: 20         # Keep top 20% from quick scan

  # Minimum trades for statistical significance
  min_trades: 10
